<html>
    <head>
        <title>valentines week</title>
    </head>
    <body>
        <h1>valentine week</h1>
        <script>
            // switch
            let day = Number(prompt("Enter your valentine week day no :"));
            switch(day){
                case 1:
                    document.write("Rose Day");
                    break;
                case 2:
                    document.write("Propose Day");
                    break;
                case 3:
                    document.write("Chocolate Day");
                    break;
                case 4:
                    document.write("Teddy Day");
                    break;
                case 5:
                    document.write("Promise Day");
                    break;
                case 6:
                    document.write("Hug Day");
                    break;
                case 7:
                    document.write("Kiss Day");
                    break;
                default:
                    document.write("enter correct day no");
            }
        </script>
    </body> 
</html>
