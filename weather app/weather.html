<html>
<head>
    <title>Weather Information App</title>
    <style>
       
        body {
            font-family: Calibri;
            background-color: rgb(234, 246, 255);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background-color: rgb(255, 255, 255);
            width: 350px;
            padding: 25px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        h1 {
            color: rgb(25, 118, 210);
            font-size: 26px;
            margin-bottom: 20px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid rgb(204, 204, 204);
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: rgb(25, 118, 210);
            color: rgb(255, 255, 255);
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }


        button:hover {
            background-color: rgb(13, 71, 161);
        }
        #weather {
            margin-top: 20px;
        }


        #cityName {
            color: rgb(51, 51, 51);
            font-size: 22px;
        }
        #weatherIcon {
            width: 100px;
            height: 100px;
        }
        #temperature {
            font-size: 28px;
            font-weight: bold;
            color: rgb(255, 152, 0);
        }
        #humidity,
        #wind,
        #condition {
            font-size: 16px;
            color: rgb(85, 85, 85);
            margin: 10px 0;
        }

        #loading {
            color: rgb(25, 118, 210);
            font-weight: bold;
        }
        #error {
            color: rgb(255, 0, 0);
            font-size: 14px;
        }

        @media (max-width: 450px) {
            .container {
                width: 85%;
                padding: 20px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Weather Information</h1>

        <input
            type="text"
            id="city"
            placeholder="Enter city name"
        >

        <button onclick="getWeather()">Search</button>

        <p id="loading"></p>

        <div id="weather">

            <h2 id="cityName"></h2>

            <img id="weatherIcon" src="" alt="Weather Icon">

            <p id="temperature"></p>

            <p id="humidity"></p>

            <p id="wind"></p>

            <p id="condition"></p>

        </div>

        <p id="error"></p>

    </div>

    <script src="weather.js"></script>

</body>

</html>
